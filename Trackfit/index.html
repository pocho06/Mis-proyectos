<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackFit</title>
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body class="auth-mode">
    <div class="app">
      <aside class="side">
        <div class="brand">
          <span class="mark">T</span>
          <div>
            <strong>TrackFit</strong>
            <span>Hábitos y progreso</span>
          </div>
        </div>
        <nav id="nav" class="nav">
        </nav>
      </aside>
      <div class="main">
        <header class="top">
          <div>
            <p id="today" class="eyebrow">Hoy</p>
            <h1 id="title">Dashboard principal</h1>
          </div>
          <div class="actions">
            <button id="reset" class="icon-btn" title="Recargar datos">
            </button>
            <button id="quick" class="primary" data-jump="peso">
            </button>
          </div>
        </header>
        <main id="content">
          <section class="auth-shell">
            <div class="auth-brand">
              <span class="mark">T</span>
              <div>
                <strong>TrackFit</strong>
                <span>Habitos y progreso</span>
              </div>
            </div>
            <div class="auth-panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Cargando</p>
                  <h1>TrackFit</h1>
                </div>
              </div>
              <p class="muted">Preparando tu cuenta...</p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div id="toast" class="toast">
    </div>
    <script src="app.js?v=9">
    </script>
  </body>
</html>
