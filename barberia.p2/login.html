<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barbería - Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeSlideIn: { "0%": { opacity: "0", transform: "translateY(10px)" }, "100%": { opacity: "1", transform: "translateY(0)" } },
            zoomIn: { "0%": { transform: "scale(0.95)", opacity: "0" }, "100%": { transform: "scale(1)", opacity: "1" } }
          },
          animation: {
            fadeSlideIn: "fadeSlideIn .5s ease both",
            zoomIn: "zoomIn .5s ease both"
          },
          colors: { base: "#0b0f14", card: "#10161d", brand: "#3b82f6", accent: "#10b981" }
        }
      }
    }
  </script>
</head>

<body class="bg-base text-white font-sans flex items-center justify-center h-screen overflow-hidden">

  <div class="bg-card w-full max-w-md rounded-2xl shadow-lg p-6 border border-white/10 animate-zoomIn">
    <h1 class="text-3xl font-bold mb-6 text-center">💈 Barbería</h1>

    <!-- Tabs -->
    <div class="flex mb-6 border-b border-white/10">
      <button id="tabLogin" class="flex-1 py-2 font-semibold border-b-2 border-brand">Iniciar sesión</button>
      <button id="tabRegister" class="flex-1 py-2 font-semibold border-b-2 border-transparent">Registrarse</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="space-y-4 animate-fadeSlideIn">
      <input id="loginEmail" type="email" placeholder="Email" required
        class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 focus:border-brand focus:ring-2 focus:ring-brand/40 transition">
      <input id="loginPass" type="password" placeholder="Contraseña" required
        class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 focus:border-brand focus:ring-2 focus:ring-brand/40 transition">
      <button type="submit"
        class="w-full py-2 rounded-xl bg-brand hover:brightness-110 shadow-md transition hover:scale-[1.02]">Entrar</button>
    </form>

    <!-- Register form -->
    <form id="registerForm" class="space-y-4 hidden">
      <input id="regName" type="text" placeholder="Nombre completo" required
        class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 focus:border-accent focus:ring-2 focus:ring-accent/40 transition">
      <input id="regEmail" type="email" placeholder="Email" required
        class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 focus:border-accent focus:ring-2 focus:ring-accent/40 transition">
      <input id="regPass" type="password" placeholder="Contraseña" required
        class="w-full px-3 py-2 rounded-xl bg-black/20 border border-white/10 focus:border-accent focus:ring-2 focus:ring-accent/40 transition">
      <button type="submit"
        class="w-full py-2 rounded-xl bg-accent hover:brightness-110 shadow-md transition hover:scale-[1.02]">Registrarme</button>
    </form>

    <!-- Mensajes -->
    <p id="msg" class="mt-4 text-center text-sm text-red-400"></p>
  </div>

  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    tabLogin.addEventListener("click", () => {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginForm.classList.add("animate-fadeSlideIn");
      tabLogin.classList.add("border-brand");
      tabRegister.classList.remove("border-accent");
    });

    tabRegister.addEventListener("click", () => {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerForm.classList.add("animate-fadeSlideIn");
      tabRegister.classList.add("border-accent");
      tabLogin.classList.remove("border-brand");
    });

    function getUsers() { return JSON.parse(localStorage.getItem("usuarios") || "[]"); }
    function saveUsers(users) { localStorage.setItem("usuarios", JSON.stringify(users)); }

    // Crear cuenta admin por defecto
    window.addEventListener("load", () => {
      const users = getUsers();
      if (!users.find(u => u.role === "admin")) {
        users.push({ email: "admin@barberia.com", pass: "1234", name: "Barbero", role: "admin" });
        saveUsers(users);
      }
    });

    registerForm.addEventListener("submit", e => {
      e.preventDefault();
      const users = getUsers();
      const email = document.getElementById("regEmail").value;
      const pass = document.getElementById("regPass").value;
      const name = document.getElementById("regName").value;

      if (users.find(u => u.email === email)) {
        msg.textContent = "⚠ Ya existe un usuario con ese email.";
        return;
      }
      users.push({ email, pass, name, role: "cliente" });
      saveUsers(users);
      msg.textContent = "✅ Registro exitoso, ahora podés iniciar sesión.";
      registerForm.reset();
    });

    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const users = getUsers();
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPass").value;
      const user = users.find(u => u.email === email && u.pass === pass);

      if (!user) {
        msg.textContent = "❌ Credenciales incorrectas.";
        return;
      }
      localStorage.setItem("sesion", JSON.stringify(user));

      if (user.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "cliente.html";
      }
    });
  </script>
</body>

</html>
